<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Настройки — WPlan Tracker</title>
    <style>
      :root { --accent: #0a84ff; --radius: 8px; color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: canvastext; -webkit-user-select: none;
        padding: 34px 22px 18px; overflow-y: auto;
      }
      .drag { -webkit-app-region: drag; position: fixed; top: 0; left: 0; right: 0; height: 30px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;
           opacity: 0.45; margin: 18px 2px 8px; font-weight: 600; }
      h2:first-of-type { margin-top: 0; }
      .card {
        background: color-mix(in srgb, canvas 60%, transparent);
        border: 1px solid color-mix(in srgb, canvastext 10%, transparent);
        border-radius: 10px; overflow: hidden;
      }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 9px 12px;
        border-top: 1px solid color-mix(in srgb, canvastext 8%, transparent);
      }
      .row:first-child { border-top: none; }
      .row label { opacity: 0.9; }
      input[type='text'], input[type='number'], input[type='time'] {
        font: inherit; text-align: right; padding: 5px 8px; min-width: 90px;
        border: 1px solid color-mix(in srgb, canvastext 15%, transparent);
        border-radius: var(--radius); background: color-mix(in srgb, canvas 70%, transparent);
        color: canvastext; outline: none;
      }
      input[type='text'].wide { min-width: 190px; text-align: left; }
      input:focus { border-color: var(--accent); }
      /* switch */
      .sw { position: relative; width: 38px; height: 22px; -webkit-app-region: no-drag; }
      .sw input { opacity: 0; width: 0; height: 0; }
      .sl { position: absolute; inset: 0; border-radius: 22px; cursor: pointer;
            background: color-mix(in srgb, canvastext 22%, transparent); transition: 0.18s; }
      .sl::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
            border-radius: 50%; background: #fff; transition: 0.18s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
      .sw input:checked + .sl { background: var(--accent); }
      .sw input:checked + .sl::before { transform: translateX(16px); }
      .actions { display: flex; gap: 8px; margin-top: 18px; }
      button {
        -webkit-app-region: no-drag; flex: 1; padding: 9px; font: inherit; font-weight: 500;
        border: none; border-radius: var(--radius); cursor: pointer;
      }
      .primary { background: var(--accent); color: #fff; }
      .ghost { background: color-mix(in srgb, canvastext 10%, transparent); color: canvastext; }
      .danger { color: #ff453a; }
      .saved { text-align: center; font-size: 11px; color: #30d158; min-height: 14px; margin-top: 8px; }
      .val { opacity: 0.6; font-variant-numeric: tabular-nums; max-width: 240px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; text-align: right; }
      .val.ok { color: #30d158; opacity: 1; }
      .val.bad { color: #ff453a; opacity: 1; }
      details.adv { margin-top: 18px; -webkit-app-region: no-drag; }
      details.adv > summary { cursor: pointer; font-size: 11px; text-transform: uppercase;
             letter-spacing: 0.4px; opacity: 0.45; font-weight: 600; margin: 0 2px 8px;
             list-style: none; }
      details.adv > summary::-webkit-details-marker { display: none; }
      details.adv > summary::before { content: '▸ '; }
      details.adv[open] > summary::before { content: '▾ '; }
    </style>
  </head>
  <body>
    <div class="drag"></div>

    <h2>Аккаунт</h2>
    <div class="card">
      <div class="row"><label>Сотрудник</label><span class="val" id="uFio">—</span></div>
      <div class="row"><label>Логин</label><span class="val" id="uLogin">—</span></div>
      <div class="row"><label>Роль</label><span class="val" id="uRole">—</span></div>
      <div class="row"><label>Сервер</label><span class="val" id="uHost">—</span></div>
      <div class="row"><label>Часовой пояс WPlan</label><span class="val" id="uTz">—</span></div>
      <div class="row"><label>Статус</label><span class="val" id="uAuth">—</span></div>
    </div>

    <h2>Напоминания (время WPlan)</h2>
    <div class="card">
      <div class="row"><label>Напоминать о старте</label>
        <span class="sw"><input id="startReminderEnabled" type="checkbox" /><span class="sl"></span></span></div>
      <div class="row"><label>Время старт-напоминания</label><input id="startReminderTime" type="time" /></div>
      <div class="row"><label>Напоминания о завершении</label><input id="endReminderTimes" type="text" placeholder="18:00, 20:00, 22:00" /></div>
      <div class="row"><label>🎉 Поздравлять, если завтра выходной</label>
        <span class="sw"><input id="tomorrowOffEnabled" type="checkbox" /><span class="sl"></span></span></div>
      <div class="row"><label>Время поздравления</label><input id="tomorrowOffTime" type="time" /></div>
    </div>

    <h2>Автозакрытие дня</h2>
    <div class="card">
      <div class="row"><label>Включить автозакрытие</label>
        <span class="sw"><input id="autocloseEnabled" type="checkbox" /><span class="sl"></span></span></div>
      <div class="row"><label>Время автозакрытия</label><input id="autocloseTime" type="time" /></div>
      <div class="row"><label>Спрашивать перед закрытием</label>
        <span class="sw"><input id="autocloseConfirm" type="checkbox" /><span class="sl"></span></span></div>
      <div class="row"><label>Окно отмены, сек</label><input id="autocloseConfirmSeconds" type="number" min="5" max="300" /></div>
      <div class="row"><label>Учёт переработок</label>
        <span class="sw"><input id="overtimeTracking" type="checkbox" /><span class="sl"></span></span></div>
    </div>

    <h2>Система</h2>
    <div class="card">
      <div class="row"><label>Запускать при входе в систему</label>
        <span class="sw"><input id="openAtLogin" type="checkbox" /><span class="sl"></span></span></div>
    </div>

    <details class="adv">
      <summary>Системные параметры</summary>
      <div class="card">
        <div class="row"><label>Хост WPlan</label><input id="host" class="wide" type="text" /></div>
        <div class="row"><label>Локаль</label><input id="locale" type="text" /></div>
        <div class="row"><label>Домен входа</label><input id="loginDomain" type="text" placeholder="office.lan" /></div>
        <div class="row"><label>Опрос состояния, мин</label><input id="pollMinutes" type="number" min="1" max="60" /></div>
      </div>
    </details>

    <div class="actions">
      <button class="ghost danger" id="logout">Сменить аккаунт</button>
      <button class="primary" id="save">Сохранить</button>
    </div>
    <div class="saved" id="saved"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const bools = ['startReminderEnabled','tomorrowOffEnabled','autocloseEnabled','autocloseConfirm','overtimeTracking','openAtLogin'];
      const nums = ['pollMinutes','autocloseConfirmSeconds'];
      const texts = ['host','locale','loginDomain','startReminderTime','tomorrowOffTime','autocloseTime'];

      api.invoke('settings:get').then((s) => {
        for (const k of bools) $(k).checked = !!s[k];
        for (const k of nums) $(k).value = s[k];
        for (const k of texts) $(k).value = s[k];
        $('endReminderTimes').value = (s.endReminderTimes || []).join(', ');
      });

      api.invoke('settings:userinfo').then((u) => {
        $('uFio').textContent = u.fio || '—';
        $('uLogin').textContent = u.login || '—';
        $('uRole').textContent = u.role || '—';
        $('uHost').textContent = (u.host || '').replace(/^https?:\/\//, '');
        $('uTz').textContent = u.tz || '—';
        const a = $('uAuth');
        a.textContent = u.authorized ? 'Авторизован' : 'Не авторизован';
        a.className = 'val ' + (u.authorized ? 'ok' : 'bad');
      });

      $('save').addEventListener('click', async () => {
        const out = {};
        for (const k of bools) out[k] = $(k).checked;
        for (const k of nums) out[k] = Number($(k).value);
        for (const k of texts) out[k] = $(k).value.trim();
        out.endReminderTimes = $('endReminderTimes').value
          .split(',').map((x) => x.trim()).filter((x) => /^\d{1,2}:\d{2}$/.test(x));
        await api.invoke('settings:save', out);
        $('saved').textContent = 'Сохранено';
        setTimeout(() => ($('saved').textContent = ''), 1500);
      });

      $('logout').addEventListener('click', () => api.invoke('settings:logout'));
    </script>
  </body>
</html>
